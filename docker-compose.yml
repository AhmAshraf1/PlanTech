# Docker Compose Configuration
version: '3.8'

services:
  database:
    container_name: "db_sqlite"
    image: alpine:latest
    command: tail -f /dev/null
    volumes:
      - db_data:/data
      - uploads_data:/uploads
    networks:
      - plantech-network

  backend:
    container_name: "backend"
    build: 
      context: ./plantech_backend
      dockerfile: Dockerfile.backend
    ports:
      - "5001:5001"
    volumes:
      - db_data:/app/database
      - uploads_data:/app/uploads
      - ./plantech_backend/plant_model_5Classes.tflite:/app/plant_model_5Classes.tflite
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_PATH=/app/database/predictions.db
    depends_on:
      - database
    networks:
      - plantech-network

  frontend:
    container_name: "frontend"
    build:
      context: ./plantech_ui
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:5001
    networks:
      - plantech-network

  nginx:
    container_name: "nginx_server"
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - plantech-network

volumes:
  db_data:
  uploads_data:

networks:
  plantech-network:
    driver: bridge